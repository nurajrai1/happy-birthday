<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday Annie!</title>
  <style>
    body {
      margin: 0;
      text-align: center;
      background: linear-gradient(to right, pink, lightblue);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    h1 {
      font-size: 3em;
      color: purple;
      margin-top: 50px;
    }
    p {
      font-size: 1.5em;
    }
    .balloon {
      position: absolute;
      bottom: -150px;
      width: 50px;
      height: 70px;
      border-radius: 50%;
      animation: float 10s infinite;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-120vh); }
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: fall 5s infinite;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(120vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>🎂 Happy Birthday, Annie! 🎉</h1>
  <p>Wishing you joy, laughter, and all the cake you can eat!</p>

  <!-- Balloons -->
  <div class="balloon" style="left:20%; background: red; animation-delay:0s;"></div>
  <div class="balloon" style="left:40%; background: blue; animation-delay:2s;"></div>
  <div class="balloon" style="left:60%; background: green; animation-delay:4s;"></div>

  <!-- Confetti -->
  <div class="confetti" style="left:10%; background: yellow; animation-delay:0s;"></div>
  <div class="confetti" style="left:30%; background: pink; animation-delay:1s;"></div>
  <div class="confetti" style="left:50%; background: orange; animation-delay:2s;"></div>
  <div class="confetti" style="left:70%; background: purple; animation-delay:3s;"></div>
</body>
</html>
